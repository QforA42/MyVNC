name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MyVNC.slnx

      - name: Build (Release)
        run: dotnet build MyVNC.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/MyVNC.Rfb.Tests -c Release --no-build --logger trx --results-directory TestResults

      # Only worth keeping when something failed — and a full artifact storage quota must not
      # turn an otherwise green run red.
      - name: Upload test results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7
