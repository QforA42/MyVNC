name: CI

# MyVNC builds on Windows only, so CI runs on a GitHub-hosted Windows runner. The job name
# build-and-test is the required check in the "master: CI must pass" ruleset; keep it.
# The full gate set, with every scanner, runs locally (node tooling/scripts/gate.mjs pre-push / ci).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore (locked)
        run: dotnet restore MyVNC.slnx --locked-mode

      - name: Format
        run: dotnet format MyVNC.slnx --verify-no-changes --no-restore

      - name: Build (Release, warnings as errors)
        run: dotnet build MyVNC.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/MyVNC.Rfb.Tests -c Release --no-build --logger trx --results-directory .local/TestResults

      # render-overview --check is not run here: the overview reads the agent files, which are local-only.
      - name: Docs and repository checks
        run: |
          node tooling/scripts/check-layout.mjs
          node tooling/scripts/check-names.mjs
          node tooling/scripts/check-frontmatter.mjs
          node tooling/scripts/check-language.mjs

      - name: NuGet vulnerabilities
        run: node tooling/scripts/dotnet-vulnerable.mjs MyVNC.slnx

      # Only worth keeping when something failed, and a full artifact storage quota must not
      # turn an otherwise green run red.
      - name: Upload test results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .local/TestResults
          retention-days: 7
