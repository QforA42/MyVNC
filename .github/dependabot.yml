version: 2
# NuGet updates stay on Dependabot while the repository is on GitHub; Renovate (.github/renovate.json)
# takes over when a Renovate runner is set up. CI workflows live in .gitea/ and are not on GitHub.
updates:
  # NuGet packages (SSH.NET and its dependencies, the test stack).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      test-stack:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]
