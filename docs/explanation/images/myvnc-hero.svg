<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-label="MyVNC: Your Wayland desktop, from Windows. Connect over LAN or Tailscale.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b45"/>
      <stop offset="0.55" stop-color="#164b70"/>
      <stop offset="1" stop-color="#247d92"/>
    </linearGradient>
    <pattern id="fine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="coarse" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.72" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#8fe3e0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8fe3e0" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8fe3e0"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#fine)"/>
  <rect width="1600" height="560" fill="url(#coarse)"/>
  <rect width="1600" height="560" fill="url(#glow)"/>


<g font-family="'Segoe UI', system-ui, -apple-system, sans-serif" fill="#ffffff">
<text x="96" y="168" font-size="22" letter-spacing="5" fill="#8fe3e0">WINDOWS · WAYLAND · REMOTE</text>
<text x="92" y="250" font-size="84" font-weight="700">MyVNC</text>
<text x="96" y="306" font-size="28" fill="#d7e9fa">Your Wayland desktop, from Windows.</text><text x="96" y="346" font-size="28" fill="#d7e9fa">Connect over LAN or Tailscale.</text>
<g font-size="18" fill="#102b45" font-weight="600"><rect x="96" y="392" width="174" height="40" rx="20" fill="#9fd3ff"/><text x="183" y="418" text-anchor="middle">Windows client</text><rect x="284" y="392" width="174" height="40" rx="20" fill="#c9f0d6"/><text x="371" y="418" text-anchor="middle">TLS verification</text><rect x="472" y="392" width="174" height="40" rx="20" fill="#ffe3a8"/><text x="559" y="418" text-anchor="middle">SSH + SFTP</text></g>
<text font-family="ui-monospace, Consolas, monospace" x="96" y="488" font-size="16" fill="#9fb8d2">RFB 3.3 / 3.7 / 3.8   # wayvnc · Hyprland · Omarchy</text>
