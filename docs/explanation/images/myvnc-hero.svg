<g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace"><text x="884" y="134" font-size="17" fill="#8fe3e0">remote.session</text><rect x="886" y="164" width="248" height="157" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#9fd3ff" stroke-width="1.5"/><path d="M886 190h248" stroke="#9fd3ff" stroke-width="1.5"/><circle cx="900" cy="177" r="3" fill="#ffe3a8"/><circle cx="912" cy="177" r="3" fill="#c9f0d6"/><path d="M906 280l54-49 41 27 43-46 70 68" fill="none" stroke="#8fe3e0" stroke-width="2"/><path d="M1010 321v22M967 344h86" stroke="#e8f4ff" stroke-width="3"/><text x="902" y="210" font-size="14" fill="#e8f4ff">Omarchy / wayvnc</text><text x="884" y="389" font-size="20" fill="#e8f4ff">Windows → Linux</text><text x="884" y="423" font-size="16" fill="#9fb8d2">LAN · Tailscale · TLS</text><text x="884" y="446" font-size="14" fill="#9fb8d2">clipboard · files · reconnect</text></g>
